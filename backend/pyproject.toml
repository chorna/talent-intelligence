[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.staging"
pythonpath = [
    "backend"
]
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py"
]