repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args:
          - --fix

      - id: ruff-format

  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: docker compose run --rm -T backend pytest
      language: system
      pass_filenames: false